{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md bg-white p-10 rounded-[40px] shadow-2xl text-center border border-slate-100">
        <h2 class="text-3xl font-black mb-2">Verify Phone</h2>
        <p class="text-slate-500 mb-8">
            Enter the 4-digit code sent to <br>
            <span class="text-black font-bold">{{ phone }}</span>
        </p>

        <form action="/verify" method="post" class="space-y-6">
            <input type="hidden" name="phone" value="{{ phone }}">
            
            <input type="hidden" name="role" value="{{ role if role else 'customer' }}">
            
            <input type="text" name="otp_in" maxlength="6" placeholder="0 0 0 0 0" required autofocus
                   class="w-full bg-slate-50 border-2 border-slate-100 p-5 rounded-2xl text-center text-4xl tracking-[0.5em] font-black focus:border-black outline-none transition">

            <button type="submit" class="w-full bg-black text-white p-5 rounded-2xl font-black text-lg hover:bg-slate-800 transition shadow-xl">
                Verify & Continue
            </button>
        </form>
        
        <p class="mt-6 text-sm text-slate-400">
            Didn't receive a code? <a href="/login" class="text-blue-600 font-bold">Try again</a>
        </p>
    </div>
</div>
{% endblock %}
