{% extends "admin_base.html" %}
{% set active = "areas" %}
{% block content %}

<div class="mb-8">
    <a href="/admin/areas" class="text-white/40 hover:text-white text-sm transition flex items-center gap-2 mb-4">
        <i class="fas fa-arrow-left"></i> Back to Areas
    </a>
    <h2 class="text-2xl font-black">Edit Parking Area</h2>
    <p class="text-white/40 text-sm mt-1">#{{ spot.id }} — {{ spot.name }}</p>
</div>

<div class="glass rounded-2xl p-8 max-w-2xl">
    <form action="/admin/areas/edit/{{ spot.id }}" method="POST" class="grid grid-cols-2 gap-5">
        <div class="col-span-2">
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Parking Name *</label>
            <input type="text" name="name" value="{{ spot.name }}" required class="form-input">
        </div>
        <div class="col-span-2">
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Address *</label>
            <input type="text" name="address" value="{{ spot.address }}" required class="form-input">
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Latitude *</label>
            <input type="text" name="lat" value="{{ spot.lat }}" required class="form-input">
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Longitude *</label>
            <input type="text" name="lng" value="{{ spot.lng }}" required class="form-input">
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Price (₹) *</label>
            <input type="number" name="price" value="{{ spot.price }}" required class="form-input">
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Unit</label>
            <select name="unit" class="form-input">
                <option value="hr" {% if spot.unit == 'hr' %}selected{% endif %}>Per Hour</option>
                <option value="day" {% if spot.unit == 'day' %}selected{% endif %}>Per Day</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Vehicle Type *</label>
            <select name="size" class="form-input">
                <option value="Car" {% if spot.size == 'Car' %}selected{% endif %}>Car</option>
                <option value="SUV" {% if spot.size == 'SUV' %}selected{% endif %}>SUV</option>
                <option value="Bike" {% if spot.size == 'Bike' %}selected{% endif %}>Bike</option>
                <option value="Truck" {% if spot.size == 'Truck' %}selected{% endif %}>Truck</option>
                <option value="EV" {% if spot.size == 'EV' %}selected{% endif %}>EV</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">Total Slots *</label>
            <input type="number" name="total_slots" value="{{ spot.total_slots }}" required class="form-input" min="1">
        </div>
        <div>
            <label class="block text-xs text-white/40 mb-2 uppercase tracking-wider">
                Available Slots
                <span class="text-white/20 normal-case ml-1">(currently {{ spot.rem_slots }})</span>
            </label>
            <input type="number" name="rem_slots" value="{{ spot.rem_slots }}" required class="form-input" min="0" max="{{ spot.total_slots }}">
        </div>
        <div class="col-span-2 flex items-center gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="is_ev" value="on" {% if spot.is_ev %}checked{% endif %} class="w-4 h-4 accent-emerald-400">
                <span class="text-sm text-white/70">⚡ EV Charging</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="handicap" value="on" {% if spot.handicap %}checked{% endif %} class="w-4 h-4 accent-blue-400">
                <span class="text-sm text-white/70">♿ Handicap Friendly</span>
            </label>
        </div>
        <div class="col-span-2 flex gap-3 mt-2">
            <button type="submit" class="btn-primary flex-1 py-3">Save Changes</button>
            <a href="/admin/areas" class="flex-1 py-3 rounded-xl border border-white/10 text-white/60 hover:text-white transition font-semibold text-center text-sm flex items-center justify-center">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
