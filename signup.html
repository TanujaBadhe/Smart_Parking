{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto p-12 min-h-screen grid grid-cols-1 md:grid-cols-2 gap-16 items-center bg-slate-950 text-white">
    
    <div class="glass p-12 rounded-[50px] border border-white/5 order-last md:order-first">
        <h1 class="text-4xl font-extrabold mb-10 flex items-center gap-3">
            <i class="fas fa-user-plus text-emerald-400"></i> Create Account
        </h1>

        <form action="/register" method="post" class="space-y-6">
            <div>
                <label class="text-sm text-slate-400 ml-1 mb-2 block">Full Name</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="text" name="name" placeholder="John Doe" required 
                           class="w-full bg-slate-900 p-5 pl-14 rounded-2xl outline-none border border-white/5 focus:border-emerald-500 text-lg">
                </div>
            </div>

            <div>
                <label class="text-sm text-slate-400 ml-1 mb-2 block">Phone Number</label>
                <div class="relative">
                    <i class="fas fa-phone-alt absolute left-5 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="tel" name="phone_number" placeholder="+1234567890" required 
                           class="w-full bg-slate-900 p-5 pl-14 rounded-2xl outline-none border border-white/5 focus:border-emerald-500 text-lg">
                </div>
            </div>

            <div>
                <label class="text-sm text-slate-400 ml-1 mb-2 block">Set Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="password" name="password" id="signup-password" placeholder="••••••••" required minlength="8"
                           class="w-full bg-slate-900 p-5 pl-14 pr-14 rounded-2xl outline-none border border-white/5 focus:border-emerald-500 text-lg">
                    <button type="button" onclick="togglePassword('signup-password', 'signup-eye')"
                            class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-emerald-400 transition">
                        <i id="signup-eye" class="fas fa-eye"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-2 ml-1">Must be at least 8 characters.</p>
            </div>

                        <button type="submit" class="w-full bg-emerald-600 py-5 rounded-2xl font-black text-lg hover:bg-emerald-500 transition shadow-lg shadow-emerald-900/20">
                Join the Network
            </button>
        </form>

        <p class="text-center text-slate-400 mt-10">
            Already have an account? 
            <a href="/login" class="text-emerald-400 font-bold hover:text-emerald-300">Log In</a>
        </p>
    </div>

    <div class="flex flex-col items-center text-center">
        <img src="https://images.unsplash.com/photo-1590674899484-d5640e854abe"
             alt="Autonomous Parking Illustration"
             class="w-full max-w-lg mb-10 drop-shadow-[0_20px_20px_rgba(34,197,94,0.1)]">
        <h2 class="text-3xl font-extrabold mb-3">Your Journey <span class="text-emerald-400">Starts Here.</span></h2>
        <p class="text-slate-400 max-w-md">Join thousands of users who have found a better way to park. Sign up in seconds.</p>
    </div>

</div>
{% endblock %}
